<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dialog_ocr_loading - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">dialog_ocr_loading.xml</span>
        <span class="screen-badge">Dialog Overlay</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div  class="android-container linearlayout" style="width: auto; height: auto; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; background-color: #FFFFFF; border-radius: 20px;"><div id="progressBarOcr" class="android-progressbar progressbar" style="width: 48px; height: 48px;"><div class="progress-fill" style="width: 60%; height: 100%; background-color: #0066FF; border-radius: 99px;"></div></div><p id="tvOcrLoadingText" class="android-textview textview" style="width: auto; height: auto; margin-top: 16px; color: #0F172A; font-size: 16px; font-weight: 700;">Reading your routine...</p></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
