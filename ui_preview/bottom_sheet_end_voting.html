<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bottom_sheet_end_voting - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">bottom_sheet_end_voting.xml</span>
        <span class="screen-badge">Modal Bottom Sheet</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div id="endVotingBottomSheetRoot" class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: column; padding-left: 20px; padding-right: 20px; padding-top: 12px; padding-bottom: 34px; background-color: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.15);"><div  class="android-container view" style="width: 40px; height: 4px; align-items: center; text-align: center; margin-bottom: 20px; background-color: #CBD5E1; border-radius: 99px;"></div><div  class="android-container framelayout" style="width: 48px; height: 48px; display: flex; flex-direction: column; position: relative; margin-bottom: 16px; background-color: #FEF2F2;"><div  class="android-imageview imageview" style="width: 24px; height: 24px; align-items: center; justify-content: center; text-align: center;"><svg width="24px" height="24px" viewBox="0 0 24 24"><path d="M8,6 L16,6 C17.105,6 18,6.895 18,8 L18,16 C18,17.105 17.105,18 16,18 L8,18 C6.895,18 6,17.105 6,16 L6,8 C6,6.895 6.895,6 8,6 Z" fill="#DC2626"/></svg></div></div><h2 id="tvEndVotingTitle" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 8px; color: #0F172A; font-size: 20px; font-weight: 700;">End voting now?</h2><p id="tvEndVotingMsg" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 24px; color: #64748B; font-size: 14px;">This will immediately stop the election. Students can no longer cast votes. This cannot be undone.</p><button id="btnCancelEndVoting" class="android-button btn btn-outlined materialbutton" style="width: 100%; height: 52px; margin-bottom: 12px; color: #0066FF; font-size: 16px; font-weight: 700; border-radius: 12px; border: 1.5px solid #0066FF;"><span>Cancel</span></button><button id="btnConfirmEndVoting" class="android-button btn btn-primary materialbutton" style="width: 100%; height: 52px; color: #FFFFFF; font-size: 16px; font-weight: 700; border-radius: 12px;"><span>End voting now</span></button></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
