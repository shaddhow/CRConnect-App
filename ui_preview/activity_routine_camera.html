<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>activity_routine_camera - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">activity_routine_camera.xml</span>
        <span class="screen-badge">Activity / Screen</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div  class="android-container constraintlayout" style="width: 100%; min-height: 100%; display: flex; flex-direction: column; position: relative; background-color: #000000;"><div id="viewFinder" class="android-container previewview" style="width: 100%; min-height: 100%;"></div><div id="layoutTopBar" class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: row; justify-content: center; padding-left: 16px; padding-right: 16px; padding-top: 48px; padding-bottom: 16px; background-color: rgba(0, 0, 0, 0.40);"><button id="ibClose" class="icon-btn imagebutton" style="width: 44px; height: 44px; background-color: transparent;"></button><p  class="android-textview textview" style="width: 0px; height: auto; flex: 1; align-items: center; justify-content: center; text-align: center; color: #FFFFFF; font-size: 18px; font-weight: 700;">Scan Class Routine</p><button id="ibFlash" class="icon-btn imagebutton" style="width: 44px; height: 44px; background-color: transparent;"></button><button id="ibFlipCamera" class="icon-btn imagebutton" style="width: 44px; height: 44px; background-color: transparent;"></button></div><div id="viewFramingBox" class="android-container view" style="margin-left: 24px; margin-right: 24px; background-color: rgba(0, 0, 0, 0.00); border: 2px solid #FFFFFF; border-radius: 16px;"></div><p id="tvScanInstruction" class="android-textview textview" style="width: auto; height: auto; padding-left: 16px; padding-right: 16px; padding-top: 8px; padding-bottom: 8px; margin-top: 16px; background-color: rgba(0, 0, 0, 0.53); color: #FFFFFF; font-size: 14px; font-weight: 700;">Align your routine within frame</p><div id="layoutBottomBar" class="android-container relativelayout" style="width: 100%; height: 120px; display: flex; flex-direction: column; position: relative; padding-bottom: 24px; background-color: rgba(0, 0, 0, 0.53);"><div id="btnShutter" class="android-container framelayout" style="width: 72px; height: 72px; display: flex; flex-direction: column; position: relative; padding: 6px; background-color: #FFFFFF; border: 1px solid #E2E8F0;"><div  class="android-container view" style="width: 100%; min-height: 100%; background-color: #0066FF;"></div></div></div></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
