<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dialog_confirm - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">dialog_confirm.xml</span>
        <span class="screen-badge">Dialog Overlay</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div id="dialogRoot" class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: column; padding: 24px;"><h2 id="dialogTitle" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 8px; color: #0F172A; font-size: 20px; font-weight: 700;">Confirm Logout</h2><p id="dialogMessage" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 24px; color: #64748B; font-size: 14px;">Are you sure you want to log out of Admin Console?</p><div  class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: row; justify-content: flex-end; text-align: right;"><button id="btnCancel" class="android-button btn btn-primary button" style="width: 0px; height: 48px; flex: 1; margin-right: 6px; color: #0066FF; font-size: 15px; font-weight: 700;"><span>Cancel</span></button><button id="btnConfirm" class="android-button btn btn-primary button" style="width: 0px; height: 48px; flex: 1; margin-left: 6px; color: #FFFFFF; font-size: 15px; font-weight: 700;"><span>Logout</span></button></div></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
