<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bottom_sheet_run_off - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">bottom_sheet_run_off.xml</span>
        <span class="screen-badge">Modal Bottom Sheet</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div id="runOffBottomSheetRoot" class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: column; padding-left: 20px; padding-right: 20px; padding-top: 12px; padding-bottom: 34px; background-color: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0,0,0,0.15);"><div  class="android-container view" style="width: 40px; height: 4px; align-items: center; text-align: center; margin-bottom: 20px; background-color: #CBD5E1; border-radius: 99px;"></div><div  class="android-container framelayout" style="width: 48px; height: 48px; display: flex; flex-direction: column; position: relative; margin-bottom: 16px; background-color: #E6F0FF; border-radius: 12px;"><div  class="android-imageview imageview" style="width: 24px; height: 24px; align-items: center; justify-content: center; text-align: center;"><svg width="24px" height="24px" viewBox="0 0 24 24"><path d="M17,1 L21,5 L17,9 M3,11 V9 A4,4 0 0,1 7,5 H21 M7,23 L3,19 L7,15 M21,13 V15 A4,4 0 0,1 17,19 H3" fill="none" stroke="#0066FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></div></div><h2 id="tvRunOffTitle" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 8px; color: #0F172A; font-size: 20px; font-weight: 700;">Start run-off election?</h2><p id="tvRunOffMsg" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 24px; color: #64748B; font-size: 14px;">This will start a run-off between tied candidates. Current results will be preserved.</p><button id="btnCancelRunOff" class="android-button btn btn-outlined materialbutton" style="width: 100%; height: 52px; margin-bottom: 12px; color: #0066FF; font-size: 16px; font-weight: 700; border-radius: 12px; border: 1.5px solid #0066FF;"><span>Cancel</span></button><button id="btnConfirmRunOff" class="android-button btn btn-primary materialbutton" style="width: 100%; height: 52px; color: #FFFFFF; font-size: 16px; font-weight: 700; border-radius: 12px;"><span>Start run-off</span></button></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
