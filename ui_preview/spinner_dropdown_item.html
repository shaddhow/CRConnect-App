<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>spinner_dropdown_item - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">spinner_dropdown_item.xml</span>
        <span class="screen-badge">Component / Item Layout</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <p id="@android:id/text1" class="android-textview textview" style="width: 100%; height: auto; padding-left: 16px; padding-right: 16px; padding-top: 14px; padding-bottom: 14px; background-color: transparent; color: #0F172A; font-size: 15px;"></p>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
