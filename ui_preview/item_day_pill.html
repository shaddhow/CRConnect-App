<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>item_day_pill - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">item_day_pill.xml</span>
        <span class="screen-badge">Component / Item Layout</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div id="layoutDayPill" class="android-container linearlayout" style="width: 0px; min-height: 100%; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding-top: 6px; padding-bottom: 6px; margin-left: 2px; margin-right: 2px; background-color: #FFFFFF; border: 1px solid #E2E8F0; border-radius: 16px;"><p id="tvDayName" class="android-textview textview" style="width: auto; height: auto; align-items: center; justify-content: center; text-align: center; color: #64748B; font-size: 10px; font-weight: 700;"></p><p id="tvDayNum" class="android-textview textview" style="width: auto; height: auto; align-items: center; justify-content: center; text-align: center; margin-top: 2px; color: #0F172A; font-size: 16px; font-weight: 700;"></p><div id="viewDot" class="android-container view" style="visibility: hidden; width: 5px; height: 5px; margin-top: 4px; background-color: #0066FF;"></div></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
