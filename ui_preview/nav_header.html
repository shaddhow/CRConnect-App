<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav_header - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">nav_header.xml</span>
        <span class="screen-badge">Component / Item Layout</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div  class="android-container linearlayout" style="width: 100%; height: 180px; display: flex; flex-direction: column; padding: 20px; border: 1px solid #E2E8F0; background: linear-gradient(180deg, #E6F6FF 0%, #FFFFFF 100%);"><div id="imgNavHeaderProfile" class="android-container shapeableimageview" style="width: 64px; height: 64px; padding: 4px; margin-bottom: 12px; background-color: #FFFFFF; border: 1px solid #E2E8F0;"></div><p id="tvNavHeaderName" class="android-textview textview" style="width: auto; height: auto; color: #0F172A; font-size: 18px; font-weight: 700;">Test Teacher (Dev)</p><h2 id="tvNavHeaderRole" class="android-textview textview" style="width: auto; height: auto; margin-top: 2px; color: #64748B; font-size: 13px;">Teacher / Admin · Department of CSE, BUBT</h2></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
