<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>list_item_announcement - CRConnect UI Preview</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="preview-header">
    <div class="preview-header-left">
        <a href="index.html" class="back-link">← Back to Screen Index</a>
        <span class="screen-title">list_item_announcement.xml</span>
        <span class="screen-badge">Component / Item Layout</span>
    </div>
    <div class="preview-header-right">
        <button onclick="toggleDeviceFrame()" class="btn-toggle-frame">📱 Toggle View Mode</button>
    </div>
</header>

<main class="preview-viewport">
    <div class="device-frame" id="deviceFrame">
        <div class="status-bar">
            <span>9:41</span>
            <div class="status-icons">
                <span>📶</span>
                <span>🔋</span>
            </div>
        </div>

        <div class="device-screen">
            <div  class="android-container materialcardview" style="width: 100%; height: auto; margin-bottom: 12px; background-color: #161B26; border-radius: 16px; border: 1.5px solid #222938; box-shadow: 0 4px 4px rgba(0,0,0,0.08);"><div  class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: column; padding: 16px;"><div  class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: row; justify-content: center; margin-bottom: 6px;"><p id="tvAnnouncementTitle" class="android-textview textview" style="width: 0px; height: auto; flex: 1; color: #FFFFFF; font-size: 16px; font-weight: 700;">Announcement Title</p><p id="tvUrgentBadge" class="android-textview textview" style="display: none !important; width: auto; height: auto; padding-left: 8px; padding-right: 8px; padding-top: 3px; padding-bottom: 3px; margin-left: 8px; background-color: #EF4444; color: #FFFFFF; font-size: 10px; font-weight: 700;">URGENT</p></div><p id="tvAnnouncementContent" class="android-textview textview" style="width: 100%; height: auto; margin-bottom: 10px; color: #D1D5DB; font-size: 14px;">Announcement content text goes here...</p><div  class="android-container linearlayout" style="width: 100%; height: auto; display: flex; flex-direction: row; justify-content: center;"><h2 id="tvAnnouncementAuthor" class="android-textview textview" style="width: 0px; height: auto; flex: 1; color: #9CA3AF; font-size: 12px;">Posted by: CR</h2><h2 id="tvAnnouncementDate" class="android-textview textview" style="width: auto; height: auto; color: #9CA3AF; font-size: 12px;">Just now</h2></div></div></div>
        </div>

        <div class="home-bar-indicator"></div>
    </div>
</main>

<script>
function toggleDeviceFrame() {
    const frame = document.getElementById('deviceFrame');
    frame.classList.toggle('full-width');
}
</script>

</body>
</html>
